<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#000000" />
  <title>Benton Area Transit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* Black status-bar backdrop + iOS modal sheet */
    .viewport {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background-color: #000000;
      padding-top: max(env(safe-area-inset-top), 12px);
    }

    .ticket-sheet {
      flex: 1;
      background-color: #ffffff;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 20px 20px env(safe-area-inset-bottom, 24px) 20px;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .header-text h1 {
      font-size: 21px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 13.5px;
      font-weight: 400;
      color: #5a5a5e;
      margin-top: 3px;
      letter-spacing: -0.1px;
    }

    .close-btn {
      background: none;
      border: none;
      padding: 2px 2px 8px 8px;
      cursor: pointer;
      color: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Pulsing Validation Badge */
    .badge-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      max-height: 290px;
      position: relative;
    }

    .pulse-ring {
      position: relative;
      width: 182px;
      height: 182px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle gray outer ring visible when blue ring contracts */
    .pulse-halo {
      position: absolute;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      border: 4px solid #d4d6d9;
      pointer-events: none;
    }

    /* Animated blue circle */
    .pulse-blue {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background-color: #28659b;
      box-shadow: inset 0 0 0 2px rgba(20, 62, 102, 0.25);
      animation: tokenPulse 3.6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes tokenPulse {
      0%   { transform: scale(0.74); }
      35%  { transform: scale(0.92); }
      55%  { transform: scale(1.0);  }
      72%  { transform: scale(0.84); }
      86%  { transform: scale(0.98); }
      100% { transform: scale(0.74); }
    }

    /* Fixed white inner circle holding the logo */
    .logo-circle {
      position: relative;
      z-index: 2;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
    }

    .logo-circle img,
    .logo-circle svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Live Clock */
    .clock {
      text-align: center;
      font-size: 46px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -1px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 18px;
    }

    /* Route Banner */
    .route-pill {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      border-radius: 18px;
      padding: 12px 16px;
      text-align: center;
      font-size: 44px;
      font-weight: 400;
      letter-spacing: 0.5px;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    /* Ticket Details Card */
    .details-card {
      width: 100%;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #eeeeee;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 20px 18px;
      text-align: left;
    }

    .ticket-title {
      font-size: 21px;
      font-weight: 400;
      color: #222222;
      line-height: 1.3;
      letter-spacing: -0.2px;
    }

    .ticket-agency {
      font-size: 13px;
      font-weight: 400;
      color: #636366;
      margin-top: 6px;
    }

    .ticket-expiry {
      font-size: 15px;
      font-weight: 600;
      color: #1c1c1e;
      margin-top: 24px;
      letter-spacing: -0.1px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="ticket-sheet">
      <!-- Top Header -->
      <header class="header">
        <div class="header-text">
          <h1>Benton Area Transit</h1>
          <p>Show operator your ticket</p>
        </div>
        <button class="close-btn" aria-label="Close" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="5" y1="5" x2="19" y2="19"></line>
            <line x1="19" y1="5" x2="5" y2="19"></line>
          </svg>
        </button>
      </header>

      <!-- Animated Pulsing Logo Badge -->
      <section class="badge-container">
        <div class="pulse-ring">
          <div class="pulse-halo"></div>
          <div class="pulse-blue"></div>
          <div class="logo-circle">
            <!-- To use your exact logo file instead, uncomment the line below and delete the <svg> block: -->
            <!-- <img src="logo.png" alt="Benton Area Transit" /> -->

            <svg viewBox="0 0 120 64" xmlns="http://www.w3.org/2000/svg" aria-label="Benton Area Transit Logo">
              <!-- Three interlocking blue circles (B A T) -->
              <circle cx="34" cy="22" r="14" fill="#2b7cb3" />
              <circle cx="60" cy="22" r="14" fill="#3a9fd5" />
              <circle cx="86" cy="22" r="14" fill="#2b7cb3" />
              <!-- Subtle white rings for crisp separation -->
              <circle cx="34" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" />
              <circle cx="60" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" />
              <circle cx="86" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" />
              <!-- Letters -->
              <text x="34" y="27" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">B</text>
              <text x="60" y="27" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">A</text>
              <text x="86" y="27" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">T</text>
              <!-- Wordmark -->
              <text x="60" y="47" text-anchor="middle" fill="#4a5568" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.6">BENTON AREA</text>
              <text x="60" y="57" text-anchor="middle" fill="#4a5568" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.2">TRANSIT</text>
            </svg>
          </div>
        </div>
      </section>

      <!-- Real-Time Ticking Clock -->
      <div class="clock" id="live-clock">--:--:-- --</div>

      <!-- Route Banner -->
      <div class="route-pill">NEW-&gt;COR</div>

      <!-- Ticket Info Card -->
      <section class="details-card">
        <div class="ticket-title">Regular Newport Corvallis<br />Single Ride</div>
        <div class="ticket-agency">Benton County, OR</div>
        <div class="ticket-expiry" id="expiry-text">Expires --</div>
      </section>
    </main>
  </div>

  <script>
    const clockEl = document.getElementById("live-clock");
    const expiryEl = document.getElementById("expiry-text");

    function formatTimeWithSeconds(date) {
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, "0");
      const seconds = String(date.getSeconds()).padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      return `${hours}:${minutes}:${seconds} ${ampm}`;
    }

    function formatExpiry(date) {
      const month = date.toLocaleString("en-US", { month: "short" });
      const day = date.getDate();
      const year = date.getFullYear();
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      return `Expires ${month} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
    }

    // Set expiration dynamically to 1 hour from when the page is opened
    const expiryDate = new Date(Date.now() + 60 * 60 * 1000);
    expiryEl.textContent = formatExpiry(expiryDate);

    // Sync ticking cleanly to the exact system second
    function updateClock() {
      const now = new Date();
      clockEl.textContent = formatTimeWithSeconds(now);
      const delay = 1000 - now.getMilliseconds();
      setTimeout(updateClock, delay);
    }

    updateClock();
  </script>
</body>
</html>
